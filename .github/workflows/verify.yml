name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Chromium needs a virtual display; the sandbox switch applies only to this CI fixture.
      - run: xvfb-run --auto-servernum npm run test:chat-links -- --no-sandbox
